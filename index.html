<!DOCTYPE html>
<html>
<head>
<title>Study Café</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-size: cover;
    background-position: center;
    transition: background-image 1s ease-in-out;
  }

  .container {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    background: rgba(0,0,0,0.45);
    padding: 20px 40px;
    border-radius: 14px;
    color: white;
    backdrop-filter: blur(6px);
  }

  #timer {
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: bold;
  }

  button {
    padding: 10px 18px;
    border: none;
    background: #ffb7c5;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
  }

  button:hover {
    background: #ffcdd9;
  }

  .chat-box {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    max-width: 600px;
    background: rgba(0,0,0,0.55);
    border-radius: 14px;
    padding: 10px;
    backdrop-filter: blur(6px);
  }

  #messages {
    max-height: 250px;
    overflow-y: auto;
    padding: 10px;
    color: white;
    font-size: 16px;
  }

  #chatInput {
    width: 75%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    margin-right: 5px;
  }

  .chat-box button {
    padding: 8px 14px;
    border: none;
    background: #ffb7c5;
    border-radius: 8px;
    cursor: pointer;
  }

</style>
</head>

<body id="scene">

<div class="container">
  <div id="timer">00:00:00</div>
  <h1>Study Café</h1>
  <p id="status">You are outside.</p>
  <button onclick="enterCafe()">Start Studying</button>
  <button onclick="leaveCafe()">Stop</button>
</div>

<div class="chat-box">
  <div id="messages"></div>
  <input type="text" id="chatInput" placeholder="Ask a question...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  let username = "";
  let timerInterval = null;
  let totalSeconds = 0;

  function askUsername() {
    username = prompt("Enter a username:");
    if (!username || username.trim() === "") {
      username = "Student";
    }
  }

  askUsername();

  const scene = document.getElementById("scene");
  const statusText = document.getElementById("status");
  const timerDisplay = document.getElementById("timer");

  function enterCafe() {
    scene.style.backgroundImage = "url('cafe.jpg')";
    statusText.textContent = "You are studying in the café ☕";
    startTimer();
  }

  function leaveCafe() {
    scene.style.backgroundImage = "url('nyc.jpg')";
    statusText.textContent = "You are outside in the city 🌆";
    stopTimer();
  }

  leaveCafe();

  function startTimer() {
    totalSeconds = 0;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      totalSeconds++;
      timerDisplay.textContent = formatTime(totalSeconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerDisplay.textContent = "00:00:00";
  }

  function formatTime(seconds) {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    return (
      (h < 10 ? "0" + h : h) + ":" +
      (m < 10 ? "0" + m : m) + ":" +
      (s < 10 ? "0" + s : s)
    );
  }

  function sendMessage() {
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("messages");

    if (input.value.trim() === "") return;

    const msg = document.createElement("div");
    msg.textContent = username + ": " + input.value;
    messages.appendChild(msg);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
